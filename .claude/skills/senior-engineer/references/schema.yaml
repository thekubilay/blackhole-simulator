          nullable: true
          readOnly: true
        actor_full_name:
          type: string
          nullable: true
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          minimum: 0
          maximum: 32767
        action_display:
          type: string
          readOnly: true
        resource_type:
          type: string
          nullable: true
          readOnly: true
        resource_id:
          type: string
        object_repr:
          type: string
          title: Object representation
        changes:
          nullable: true
