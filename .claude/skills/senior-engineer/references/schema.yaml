components:
  schemas:
    APITokenCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        duration:
          allOf:
          - $ref: '#/components/schemas/DurationEnum'
          title: 時間差分
    APITokenCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        duration:
          allOf:
          - $ref: '#/components/schemas/DurationEnum'
          title: 時間差分
    APITokenDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          title: キー
          maxLength: 40
        name:
          type: string
          maxLength: 255
        duration:
          allOf:
          - $ref: '#/components/schemas/DurationEnum'
          title: 時間差分
        created:
          type: string
          format: date-time
          readOnly: true
          title: 作成された
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_valid:
          type: boolean
          readOnly: true
      required:
      - created
      - id
      - is_valid
      - key
    APITokenList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        masked_key:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        duration:
          allOf:
          - $ref: '#/components/schemas/DurationEnum'
          title: 時間差分
        created:
          type: string
          format: date-time
          readOnly: true
          title: 作成された
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_valid:
          type: boolean
          readOnly: true
      required:
      - created
      - id
      - is_valid
      - masked_key
    ActionEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `0` - create
        * `1` - update
        * `2` - delete
        * `3` - access
    ActionLogList:
      type: object
      properties:
